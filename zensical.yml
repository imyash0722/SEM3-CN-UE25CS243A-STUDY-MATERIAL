site_name: Computer Networks Exam Prep — UE25CS243A
site_description: Complete study guide for Computer Networks (UE25CS243A) covering Units 1-4
site_url: https://imyash0722.github.io/SEM3-CN-UE25CS243A-STUDY-MATERIAL/
repo_url: https://github.com/imyash0722/SEM3-CN-UE25CS243A-STUDY-MATERIAL
repo_name: SEM3-CN-UE25CS243A-STUDY-MATERIAL

theme:
  name: zensical
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - content.tabs.link
    - color.mode

extra_javascript:
  - assets/javascripts/theme-toggle.js

nav:
  - Home: index.md
  - "Unit 1: Internet & Application Layer":
      - "Overview & Syllabus": unit1/00_overview.md
      - "Chapter 1: Computer Networks & the Internet":
          - "1.1 What Is the Internet?": unit1/topics/1.1_what_is_the_internet.md
          - "1.2 The Network Edge": unit1/topics/1.2_the_network_edge.md
          - "1.3 The Network Core": unit1/topics/1.3_the_network_core.md
          - "1.4 Delay, Loss, and Throughput": unit1/topics/1.4_delay_loss_throughput.md
          - "1.5 Protocol Layers": unit1/topics/1.5_protocol_layers.md
          - "1.6 Network Security": unit1/topics/1.6_network_security.md
          - "1.7 History of Networking": unit1/topics/1.7_history.md
      - "Chapter 2: Application Layer":
          - "2.1 Principles of Network Applications": unit1/topics/2.1_network_app_principles.md
          - "2.2 The Web and HTTP": unit1/topics/2.2_web_http.md
          - "2.3 Electronic Mail": unit1/topics/2.3_email.md
          - "2.4 DNS": unit1/topics/2.4_dns.md
          - "2.5 Video Streaming & CDNs": unit1/topics/2.5_video_cdn.md
          - "2.6 Socket Programming": unit1/topics/2.6_socket_programming.md
      - "Complete Unit 1 Notes": unit1/unit1_complete.md
  - "Unit 2: Transport Layer":
      - Overview: unit2/00_overview.md
      - "Chapter 3: Transport Layer":
          - "3.1 Transport Services": unit2/topics/3.1_intro_transport_services.md
          - "3.2 Multiplexing & Demultiplexing": unit2/topics/3.2_multiplexing_demultiplexing.md
          - "3.3 UDP": unit2/topics/3.3_udp.md
          - "3.4 Reliable Data Transfer (GBN/SR)": unit2/topics/3.4_reliable_data_transfer.md
          - "3.5 TCP": unit2/topics/3.5_tcp.md
          - "3.6-3.7 Congestion Control": unit2/topics/3.6_3.7_congestion_control.md
      - "Complete Unit 2 Notes": unit2/unit2_complete.md
  - "Unit 3: Network Layer":
      - Overview: unit3/00_overview.md
      - "Chapter 4: Data Plane":
          - "4.1 Network Layer Overview": unit3/topics/4.1_network_layer_overview.md
          - "4.2 Inside a Router": unit3/topics/4.2_inside_router.md
          - "4.3-4.4 IPv4 & Fragmentation": unit3/topics/4.3_4.4_ipv4_fragmentation.md
          - "4.5 IPv4 Addressing & NAT": unit3/topics/4.5_addressing_nat.md
      - "Chapter 5: Control Plane":
          - "5.1-5.3 Routing Algorithms (Dijkstra/Bellman-Ford)": unit3/topics/5.1_5.3_routing_algorithms.md
          - "4.6 SDN & OpenFlow": unit3/topics/4.6_sdn.md
          - "4.7 Data Center Networking": unit3/topics/4.7_datacenter_networks.md
      - "Additional Topics":
          - "IPv6": unit3/topics/ipv6.md
          - "ICMP": unit3/topics/icmp.md
          - "DHCP": unit3/topics/dhcp.md
      - "Complete Unit 3 Notes": unit3/unit3_complete.md
  - "Unit 4: Link Layer & LAN":
      - Overview: unit4/00_overview.md
      - "Chapter 6: Link Layer & LAN":
          - "6.1 Introduction to Link Layer": unit4/topics/6.1_intro_link_layer.md
          - "6.2 Error Detection & Correction": unit4/topics/6.2_error_detection_correction.md
          - "6.3 Multiple Access Protocols (CSMA/CD/CA)": unit4/topics/6.3_multiple_access.md
          - "6.4 Switched LANs, MAC, ARP": unit4/topics/6.4_switched_lans.md
          - "6.5 Ethernet": unit4/topics/6.5_ethernet.md
          - "6.6 Ethernet Switches": unit4/topics/6.6_switches.md
          - "6.7 VLANs": unit4/topics/6.7_vlans.md
          - "6.8 A Day in the Life of a Web Request": unit4/topics/6.8_day_in_life.md
          - "6.9 Physical Layer": unit4/topics/6.9_physical_layer.md
          - "6.10 Wireless LANs (802.11)": unit4/topics/6.10_wireless_lans.md
      - "Complete Unit 4 Notes": unit4/unit4_complete.md
  - "Formulae Sheet": formulae_sheet.md
  - "Master Index & Study Checklist": MASTER_INDEX.md

markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - footnotes

